name: Windows signed release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - name: Check release metadata
        run: python tools/check-release.py
      - name: Build the original plugin examples
        shell: cmd
        run: .github\build-examples.cmd
      - name: Core regression
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installers and signed updater manifest
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Prisme __VERSION__
          releaseBody: 'Jalon de développement Windows x64. Lire les limites dans BILAN_ACTUEL.md et DISTRIBUTION.md. Les quatre lots I.2, I.3, I.4 et II.1 restent suivis dans PLAN.md.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterSignatures: true
          args: --bundles nsis,msi
